<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Takk for henvendelsen | TakNova</title><link rel="stylesheet" href="style.css?v=restore1022"><style>body{min-height:100vh;display:flex;flex-direction:column}.thanks{flex:1;display:grid;place-items:center;padding:60px 20px}.thanks-card{max-width:660px;text-align:center}.check{display:grid;place-items:center;margin:0 auto 30px;width:76px;height:76px;border-radius:50%;background:#e5eee5;color:#276d49;font-size:36px}.thanks h1{font-size:clamp(2.5rem,5vw,4.3rem)}.thanks p{font-size:1.12rem;color:#687270;margin:18px auto 32px}.language-switch{margin-left:auto}@media(max-width:600px){.nav{gap:12px}}@keyframes gentleReveal{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}.thanks-card{animation:gentleReveal .95s ease-out 5s both}.check{animation:gentleReveal 1.1s ease-out 5s both}@media(prefers-reduced-motion:reduce){.thanks-card,.check{animation:none}}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">taknova<span>.</span><small id="brand-subtitle">STREKKTAK · AKERSHUS</small></a><div class="language-switch" role="group" aria-label="Choose language"><button class="lang active" type="button" data-lang="no">NO</button><button class="lang" type="button" data-lang="en">EN</button><button class="lang" type="button" data-lang="uk">UA</button></div></div></header><main class="thanks"><div class="thanks-card"><div class="check" aria-hidden="true">✓</div><p class="eyebrow" id="eyebrow">FORESPØRSEL SENDT</p><h1 id="heading">Takk for henvendelsen!</h1><p id="detail">Vi har mottatt forespørselen din. Takk for at du tok kontakt med TakNova. Vi vil kontakte deg så snart som mulig.</p><a class="btn primary" href="index.html" id="back">Tilbake til forsiden ↗</a></div></main><footer class="wrap footer"><span>© TakNova · <span id="region">Akershus</span></span><a href="personvern.html">Personvern</a></footer><script>const t={no:['FORESPØRSEL SENDT','Takk for henvendelsen!','Vi har mottatt forespørselen din. Takk for at du tok kontakt med TakNova. Vi vil kontakte deg så snart som mulig.','Tilbake til forsiden ↗','Personvern'],en:['ENQUIRY SENT','Thank you for contacting us!','We have received your enquiry. Thank you for contacting TakNova. We will get back to you as soon as possible.','Back to homepage ↗','Privacy'],uk:['ЗАЯВКУ НАДІСЛАНО','Дякуємо за звернення!','Ми отримали вашу заявку. Дякуємо, що звернулися до TakNova. Ми зв’яжемося з вами найближчим часом.','Повернутися на головну ↗','Конфіденційність']};function setLang(lang){if(!t[lang])lang='no';document.documentElement.lang=lang==='no'?'nb':lang;['eyebrow','heading','detail','back'].forEach((id,i)=>document.getElementById(id).textContent=t[lang][i]);document.querySelector('.footer a').textContent=t[lang][4];document.getElementById('brand-subtitle').textContent=lang==='uk'?'НАТЯЖНІ СТЕЛІ · АКЕРСГУС':lang==='en'?'STRETCH CEILINGS · AKERSHUS':'STREKKTAK · AKERSHUS';document.getElementById('region').textContent=lang==='uk'?'Акерсгус':'Akershus';document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));try{localStorage.setItem('taknova-language',lang)}catch(e){}}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));let lang='no';try{lang=localStorage.getItem('taknova-language')||'no'}catch(e){}setLang(lang);</script></body></html>
